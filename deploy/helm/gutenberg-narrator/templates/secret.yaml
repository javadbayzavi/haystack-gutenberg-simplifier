{{- if not .Values.secrets.existingSecret }}
{{- if and (eq .Values.engine "hosted") (not .Values.secrets.ttsApiKey) }}
{{- fail "engine is \"hosted\" but secrets.ttsApiKey is unset. Set it, point secrets.existingSecret at a Secret you manage, or use engine: stub. Refusing to render pods that would fail readiness on every replica." }}
{{- end }}
{{- if or .Values.secrets.ttsApiKey .Values.secrets.apiToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gutenberg-narrator.fullname" . }}
  labels:
    {{- include "gutenberg-narrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.ttsApiKey }}
  TTS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.apiToken }}
  NARRATOR_API_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
