apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gutenberg-simplifier.fullname" . }}
  labels:
    {{- include "gutenberg-simplifier.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gutenberg-simplifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when configuration changes. Without this a `helm upgrade`
        # that only alters the ConfigMap or Secret leaves every pod running the
        # old values, because nothing in the pod spec changed.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gutenberg-simplifier.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gutenberg-simplifier.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long, because a streamed rewrite runs for minutes. The 30s default would
      # cut in-flight streams on every rollout.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 1416
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "gutenberg-simplifier.fullname" . }}
            - secretRef:
                name: {{ include "gutenberg-simplifier.secretName" . }}
          # Startup gates the other two. Boot involves starting Python, scanning
          # the pipelines directory and building the pipeline; without this a
          # slow start is indistinguishable from a hang and gets restarted.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          # Liveness asks only whether the process is wedged. It must never test
          # a dependency: if it checked the model API, one upstream outage would
          # restart every pod in the fleet at once and turn a degradation into
          # an outage.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # Readiness does check configuration. A missing API key takes the pod
          # out of rotation without restarting it, which is right: no restart
          # can conjure a secret.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          lifecycle:
            preStop:
              # Endpoint removal and the SIGTERM race each other. Pausing first
              # lets the ingress stop sending new work before the process starts
              # refusing it, so a rollout drops no requests.
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so every path the process writes to
            # needs an explicit writable mount. Verified against the image:
            # these two are the only ones.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
