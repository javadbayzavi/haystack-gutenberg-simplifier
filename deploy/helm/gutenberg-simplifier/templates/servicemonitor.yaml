{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gutenberg-simplifier.fullname" . }}
  labels:
    {{- include "gutenberg-simplifier.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gutenberg-simplifier.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.secrets.apiToken }}
      # /metrics is behind the bearer token on purpose: it reveals request
      # volume and spend. Prometheus reads the same Secret the app does.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "gutenberg-simplifier.secretName" . }}
          key: GUTENBERG_API_TOKEN
      {{- end }}
{{- end }}
