{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gutenberg-simplifier.fullname" . }}
  labels:
    {{- include "gutenberg-simplifier.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gutenberg-simplifier.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # CPU is a poor signal for a service that spends its time waiting on an
    # upstream API -- it will look idle under heavy load. Kept because it is
    # the portable default; concurrency or queue depth via KEDA is the better
    # trigger for this workload.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
