{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.anthropicApiKey }}
{{- fail "secrets.anthropicApiKey is required, or set secrets.existingSecret to a Secret you manage. Refusing to render a deployment that can never become ready." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gutenberg-simplifier.fullname" . }}
  labels:
    {{- include "gutenberg-simplifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- if .Values.secrets.apiToken }}
  GUTENBERG_API_TOKEN: {{ .Values.secrets.apiToken | quote }}
  {{- end }}
{{- end }}
