[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gutenberg-simplifier"
version = "0.1.0"
description = "Age-tiered simplification of Project Gutenberg books, served with Haystack + Hayhooks"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
# Nothing is shared. The two services are deployed separately and their images
# must not carry each other's dependencies -- a narrator image containing
# Haystack, or a simplifier image containing a TTS client, is a coupling that
# shows up as image size, CVE surface and rebuild churn.
dependencies = []

[project.optional-dependencies]
simplifier = [
    "haystack-ai>=3.0.0",
    "anthropic-haystack>=5.0",
    "hayhooks>=1.24",
    "httpx>=0.28",
    "tenacity>=9.0",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "prometheus-client>=0.21",
    "uvicorn>=0.30",
]
narrator = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "tenacity>=9.0",
]
all = ["gutenberg-simplifier[narrator,simplifier]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
gutenberg-simplifier = "gutenberg_simplifier.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gutenberg_simplifier", "src/gutenberg_narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
asyncio_mode = "auto"
markers = [
    "network: hits the real Project Gutenberg site; deselected by default",
]

[tool.ruff]
src = ["src", "tests", "pipelines", "evals"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "TRY"]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["gutenberg_simplifier", "tests", "evals"]

[tool.mypy]
# No python_version pin: mypy then targets the running interpreter. Pinning it
# made mypy parse third-party stubs (numpy, via haystack) under an older
# grammar than the venv actually uses.
files = ["src", "tests", "pipelines", "evals"]
strict = true
warn_unreachable = true

# hayhooks ships no py.typed marker, so its symbols arrive as Any. Scoped to
# that package rather than relaxing strictness globally.
[[tool.mypy.overrides]]
module = ["hayhooks.*"]
ignore_missing_imports = true
