name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and the version the container runs.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[all,dev]"

      # The same targets a developer runs, pointed at this interpreter. mypy
      # takes its target version from the running interpreter, so the matrix
      # genuinely type-checks the declared floor rather than only the newest.
      - name: Lint
        run: make lint PY=python

      - name: Type check
        run: make typecheck PY=python

      # No network and no API key: the HTTP client and both chat generators are
      # injectable, and network-marked tests are deselected by default.
      - name: Test
        run: make test PY=python

      - name: Eval harness self-check
        run: make eval-dry PY=python

  image:
    name: ${{ matrix.service }} image builds and serves
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: simplifier
            dockerfile: docker/simplifier.Dockerfile
            port: 1416
            env: "-e ANTHROPIC_API_KEY=ci-placeholder"
          - service: narrator
            dockerfile: docker/narrator.Dockerfile
            port: 1417
            env: ""

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.service }}:ci .

      # Building is not enough. An earlier image built cleanly and died at
      # startup because Haystack's telemetry writes to $HOME at import time and
      # the non-root user had none. Only starting it catches that, and running
      # read-only catches the paths a container actually needs to write.
      - name: Start and probe
        run: |
          docker run -d --name ci --read-only --tmpfs /tmp --tmpfs /home/app \
            -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.env }} \
            ${{ matrix.service }}:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:${{ matrix.port }}/health/live >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:${{ matrix.port }}/health/live
          curl -sf http://localhost:${{ matrix.port }}/health/ready

      - name: Runs as non-root
        run: test "$(docker exec ci id -u)" = "10001"

      # The services are deployed separately and must not carry each other's
      # code or dependencies. One pyproject builds one distribution containing
      # both packages, so each Dockerfile prunes the other -- and a prune that
      # silently stopped matching would otherwise go unnoticed.
      - name: Image carries only its own service
        run: |
          docker run --rm ${{ matrix.service }}:ci python -c "
          import importlib.util as u, sys
          own, other = ('gutenberg_${{ matrix.service }}',
                        'gutenberg_narrator' if '${{ matrix.service }}' == 'simplifier'
                        else 'gutenberg_simplifier')
          if not u.find_spec(own):
              sys.exit(f'{own} is missing from its own image')
          if u.find_spec(other):
              sys.exit(f'image contains {other}, which it never runs')
          "

      - name: Narrator carries no simplifier dependencies
        if: matrix.service == 'narrator'
        run: |
          docker run --rm narrator:ci python -c "
          import importlib.util as u, sys
          leaked = [m for m in ('haystack', 'anthropic', 'hayhooks', 'opentelemetry')
                    if u.find_spec(m)]
          if leaked:
              sys.exit(f'narrator image contains {leaked}')
          "

      - name: Logs on failure
        if: failure()
        run: docker logs ci

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Lint
        run: |
          helm lint deploy/helm/gutenberg-simplifier --set secrets.anthropicApiKey=ci
          helm lint deploy/helm/gutenberg-narrator

      - name: Render every optional path
        run: |
          helm template gs deploy/helm/gutenberg-simplifier \
            --set secrets.anthropicApiKey=ci --set secrets.apiToken=ci \
            --set autoscaling.enabled=true --set metrics.serviceMonitor.enabled=true \
            > /dev/null
          helm template gn deploy/helm/gutenberg-narrator > /dev/null
          helm template gn deploy/helm/gutenberg-narrator \
            --set engine=hosted --set secrets.ttsApiKey=ci --set secrets.apiToken=ci \
            --set autoscaling.enabled=true --set metrics.serviceMonitor.enabled=true \
            > /dev/null
          helm template gn deploy/helm/gutenberg-narrator \
            --set engine=hosted --set secrets.existingSecret=managed > /dev/null

      # Both charts must refuse to deploy pods that could never pass readiness.
      - name: Refuse to render without a credential
        run: |
          if helm template gs deploy/helm/gutenberg-simplifier >/dev/null 2>&1; then
            echo "simplifier chart rendered without an API key" >&2
            exit 1
          fi
          if helm template gn deploy/helm/gutenberg-narrator --set engine=hosted >/dev/null 2>&1; then
            echo "narrator chart rendered a hosted engine with no credential" >&2
            exit 1
          fi

      # The stub engine needs no Secret, and an envFrom naming one that was
      # never created leaves every pod in CreateContainerConfigError.
      - name: Stub engine renders without a secretRef
        run: |
          if helm template gn deploy/helm/gutenberg-narrator | grep -q secretRef; then
            echo "stub rendering references a Secret that is not created" >&2
            exit 1
          fi
